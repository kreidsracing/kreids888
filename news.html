<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KREIDS888 · News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<meta name="description" content="News, Updates und Rennberichte von Kreids888 — Sim Racing auf iRacing.">
<link rel="canonical" href="https://kreids888.com/news.html">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KREIDS888">
<meta property="og:locale" content="de_DE">
<meta property="og:title" content="KREIDS888 · News">
<meta property="og:description" content="News, Updates und Rennberichte von Kreids888.">
<meta property="og:url" content="https://kreids888.com/news.html">
<meta property="og:image" content="https://kreids888.com/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0a0a">
<style>
/* ===== NEWS · Timing-Tower Streifen + Inline-Accordion ===== */
.news-feed{margin-top:26px;border-top:1px solid var(--line)}
.nstrip{border-bottom:1px solid var(--line);position:relative}
.nstrip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--red);box-shadow:0 0 14px var(--red-glow);
  transform:scaleY(0);transform-origin:center;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.nstrip.open::before,.nstrip:hover::before{transform:scaleY(1)}

/* Kopf – immer sichtbar, klickbar */
.nstrip-head{display:grid;grid-template-columns:92px 1fr 34px;align-items:center;gap:20px;
  width:100%;text-align:left;background:none;border:0;cursor:pointer;color:inherit;
  padding:22px 8px 22px 22px;font-family:var(--body);transition:padding-left .28s cubic-bezier(.4,0,.2,1),background .2s}
.nstrip:hover .nstrip-head{padding-left:30px;background:linear-gradient(90deg,rgba(225,19,36,.06),transparent 55%)}
.nstrip.open .nstrip-head{padding-left:30px}

.nstrip-date{font-family:var(--disp);font-weight:800;line-height:.92;letter-spacing:.02em}
.nstrip-date .d{display:block;font-size:30px;color:var(--white)}
.nstrip-date .my{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-top:3px}

.nstrip-mid{min-width:0}
.nstrip-title{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.005em;
  font-size:clamp(19px,2.4vw,25px);line-height:1.05;color:var(--white);margin:0}
.nstrip:hover .nstrip-title{color:#fff}
.nstrip-ex{font-size:14px;line-height:1.5;color:var(--steel);margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:70ch}
.nstrip.open .nstrip-ex{display:none}

.nstrip-chev{width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);color:var(--steel);transition:.25s;flex:none}
.nstrip:hover .nstrip-chev{border-color:var(--red);color:var(--red)}
.nstrip-chev svg{width:16px;height:16px;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.nstrip.open .nstrip-chev{border-color:var(--red);color:#fff;background:var(--red)}
.nstrip.open .nstrip-chev svg{transform:rotate(180deg)}

/* Panel – smooth aufklappen via grid-rows */
.nstrip-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.4,0,.2,1)}
.nstrip.open .nstrip-wrap{grid-template-rows:1fr}
.nstrip-panel{overflow:hidden;min-height:0}
.nstrip-inner{padding:2px 22px 30px 30px;max-width:820px}
.nstrip-cover{width:100%;border:1px solid var(--line);display:block;margin:0 0 20px}
.nstrip-lead{font-size:17px;line-height:1.6;color:var(--white);font-weight:500;margin:0 0 16px}
.nstrip-body p{font-size:15.5px;line-height:1.75;color:#cfd4dd;margin:0 0 15px}
.nstrip-body h3{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:20px;margin:24px 0 9px;color:#fff}
.nstrip-body blockquote{border-left:3px solid var(--red);margin:0 0 15px;padding:5px 0 5px 15px;color:var(--steel)}
.nstrip-body .article-img{width:100%;border:1px solid var(--line);margin:5px 0 16px;display:block}
.nstrip-body a{color:var(--red)}

@media(max-width:560px){
  .nstrip-head{grid-template-columns:64px 1fr 30px;gap:13px;padding:18px 6px 18px 18px}
  .nstrip-date .d{font-size:24px}
  .nstrip-inner{padding-left:18px;padding-right:16px}
}
@media(prefers-reduced-motion:reduce){
  .nstrip-wrap,.nstrip-chev svg,.nstrip::before,.nstrip-head{transition:none}
}
</style>
</head>
<body>
<nav id="site-nav"></nav>
<main class="page">
  <div class="container">
    <div class="lap-tag">Newsroom</div>
    <h2>News &amp; <span class="r">Updates</span></h2>

    <div id="newsFeed" class="news-feed"><p class="sk-empty">Beiträge werden geladen…</p></div>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="components.js"></script>
<script>
(function(){
  var ADMIN_API="https://kreids888-admin.kreids.workers.dev";
  var POSTS=[];
  var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");};
  var MO=["Jan","Feb","März","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  function dayNum(d){ var p=String(d||"").split("-"); return p.length<3?"–":(+p[2]); }
  function monYear(d){ var p=String(d||"").split("-"); return p.length<3?"":(MO[(+p[1])-1]+" "+p[0]); }

  /* --- Mini-Markdown (ohne Backslash-Regex) --- */
  function mdLinkify(s){
    var out="",i=0;
    while(true){
      var lb=s.indexOf("[",i); if(lb<0){out+=s.slice(i);break;}
      var rb=s.indexOf("](",lb); var rp=rb>=0?s.indexOf(")",rb+2):-1;
      if(rb<0||rp<0){out+=s.slice(i);break;}
      out+=s.slice(i,lb);
      var txt=s.slice(lb+1,rb), url=s.slice(rb+2,rp);
      if(url.indexOf("http")===0) out+='<a href="'+url+'" target="_blank" rel="noopener">'+txt+'</a>';
      else out+=s.slice(lb,rp+1);
      i=rp+1;
    }
    return out;
  }
  function mdInline(s){
    s=esc(s); var parts=s.split("**"), r="";
    for(var i=0;i<parts.length;i++){ r+=(i%2?"<strong>"+parts[i]+"</strong>":parts[i]); }
    return mdLinkify(r);
  }
  function mdRender(text){
    var NL=String.fromCharCode(10);
    var lines=String(text||"").split(NL);
    var html="",para=[];
    function flush(){ if(para.length){ html+="<p>"+para.join("<br>")+"</p>"; para=[]; } }
    for(var i=0;i<lines.length;i++){
      var t=lines[i].trim();
      if(t===""){ flush(); continue; }
      if(t.indexOf("![")===0 && t.indexOf("](")>0 && t.charAt(t.length-1)===")"){
        var u=t.substring(t.indexOf("](")+2,t.length-1);
        flush(); html+='<img class="article-img" src="'+esc(u)+'" alt="" loading="lazy">'; continue;
      }
      if(t.substring(0,3)==="## "){ flush(); html+="<h3>"+mdInline(t.substring(3))+"</h3>"; continue; }
      if(t.substring(0,2)==="> "){ flush(); html+="<blockquote>"+mdInline(t.substring(2))+"</blockquote>"; continue; }
      para.push(mdInline(t));
    }
    flush(); return html;
  }

  var CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

  function renderFeed(){
    var el=document.getElementById("newsFeed");
    if(!POSTS.length){ el.innerHTML='<p class="sk-empty" style="padding:22px 0">Noch keine Beiträge — schau bald wieder vorbei!</p>'; return; }
    el.innerHTML=POSTS.map(function(p,i){
      var ex=p.excerpt?p.excerpt:(p.body||"").replace(/[#*>!\[\]()]/g," ").replace(/\s+/g," ").trim().slice(0,180);
      var cover=p.cover?'<img class="nstrip-cover" src="'+esc(p.cover)+'" alt="" loading="lazy">':'';
      var lead=p.excerpt?'<p class="nstrip-lead">'+esc(p.excerpt)+'</p>':'';
      return '<div class="nstrip" data-i="'+i+'" id="post-'+encodeURIComponent(p.id)+'">'+
        '<button class="nstrip-head" type="button" aria-expanded="false">'+
          '<span class="nstrip-date"><span class="d">'+esc(dayNum(p.date))+'</span><span class="my">'+esc(monYear(p.date))+'</span></span>'+
          '<span class="nstrip-mid">'+
            '<h2 class="nstrip-title">'+esc(p.title||"(ohne Titel)")+'</h2>'+
            (ex?'<span class="nstrip-ex">'+esc(ex)+'</span>':'')+
          '</span>'+
          '<span class="nstrip-chev">'+CHEV+'</span>'+
        '</button>'+
        '<div class="nstrip-wrap"><div class="nstrip-panel"><div class="nstrip-inner">'+
          cover+lead+'<div class="nstrip-body">'+mdRender(p.body||"")+'</div>'+
        '</div></div></div>'+
      '</div>';
    }).join("");

    [].forEach.call(el.querySelectorAll(".nstrip-head"),function(btn){
      btn.addEventListener("click",function(){ toggle(btn.parentNode); });
    });
  }

  function toggle(strip){
    var open=strip.classList.toggle("open");
    strip.querySelector(".nstrip-head").setAttribute("aria-expanded",open?"true":"false");
    if(open){
      var id=strip.id;
      if(id) history.replaceState(null,"","#"+id);
    } else if(location.hash==="#"+strip.id){
      history.replaceState(null,"",location.pathname);
    }
  }

  function openFromHash(){
    var h=location.hash||""; if(h.indexOf("#post-")!==0) return;
    var strip=document.getElementById(h.slice(1));
    if(strip && !strip.classList.contains("open")){
      strip.classList.add("open");
      strip.querySelector(".nstrip-head").setAttribute("aria-expanded","true");
      setTimeout(function(){ strip.scrollIntoView({behavior:"smooth",block:"start"}); },120);
    }
  }

  fetch(ADMIN_API+"/api/news").then(function(r){return r.json();}).then(function(d){
    POSTS=Array.isArray(d.posts)?d.posts:[];
    renderFeed(); openFromHash();
  }).catch(function(){
    document.getElementById("newsFeed").innerHTML='<p class="sk-empty" style="padding:22px 0">News konnten nicht geladen werden.</p>';
  });
})();
</script>
</body></html>
