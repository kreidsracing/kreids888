<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="style.css">

<meta property="og:url" content="https://kreids888.com/setup.html">
<meta property="og:image" content="https://kreids888.com/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0a0a">
</head>
<body>
<nav id="site-nav"></nav>
<main class="page">
  <div class="container">
    <div class="lap-tag">The Rig</div>
    <h2>Mein Setup</h2>
    <p class="setup-intro">Womit ich fahre und streame — vom PC bis zum Rig.</p>
    <div id="setupContainer"><p class="sk-empty">Setup wird geladen…</p></div>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="components.js"></script>
<script>
(function(){
  var ADMIN_API="https://kreids888-admin.kreids.workers.dev";
  var container=document.getElementById("setupContainer");
  var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");};

  var DEFAULTS=[
    {title:"PC & Hardware",sub:"Rechenpower & Peripherie",items:[
      {cat:"GPU",name:"RTX 5080"},{cat:"CPU",name:"Ryzen 7 9800X3D"},{cat:"Mainboard",name:""},
      {cat:"RAM",name:""},{cat:"Speicher",name:""},{cat:"Netzteil",name:""},{cat:"Kühlung",name:""},
      {cat:"Monitore",name:'Triple 3x 32" AOC + 29"'}]},
    {title:"Sim-Rig",sub:"Base · Wheel · Pedale · Chassis",items:[
      {cat:"Wheelbase",name:"Asetek Forte"},{cat:"Wheel",name:"Bavarian Simtec Omeg Pro"},
      {cat:"Pedale",name:"Simagic P2000"},{cat:"Rig / Chassis",name:""},{cat:"Handbremse",name:""},
      {cat:"Shifter",name:""},{cat:"Sitz",name:""},{cat:"Sonstiges",name:""}]}
  ];

  function render(sections){
    if(!sections||!sections.length){ container.innerHTML='<p class="sk-empty">Setup wird bald ergänzt.</p>'; return; }
    container.innerHTML=sections.map(function(sec,i){
      var idx=(i+1)<10?"0"+(i+1):""+(i+1);
      var items=(sec.items||[]).map(function(it){
        var empty=!it.name||!String(it.name).trim();
        return '<div class="rig-item'+(empty?" is-empty":"")+'">'+
          '<div class="cat">'+esc(it.cat)+'</div>'+
          '<div class="name">'+(empty?"— folgt —":esc(it.name))+'</div></div>';
      }).join("");
      return '<section class="setup-group">'+
        '<div class="setup-group-head"><span class="idx">'+idx+'</span>'+
        '<div class="head-txt"><h3>'+esc(sec.title)+'</h3>'+
        (sec.sub?'<span class="sub">'+esc(sec.sub)+'</span>':'')+'</div></div>'+
        '<div class="rig">'+items+'</div></section>';
    }).join("");
  }

  fetch(ADMIN_API+"/api/setup").then(function(r){return r.json();}).then(function(d){
    render((d&&Array.isArray(d.sections)&&d.sections.length)?d.sections:DEFAULTS);
  }).catch(function(){ render(DEFAULTS); });
})();
</script>
</body>
</html>
