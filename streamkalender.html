<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KREIDS888 · Streamkalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<meta name="description" content="Streamkalender von Kreids888 — wann ich live auf Twitch und YouTube gehe: Rennen, Training, Streams.">
<link rel="canonical" href="https://kreids888.com/streamkalender.html">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KREIDS888">
<meta property="og:locale" content="de_DE">
<meta property="og:title" content="KREIDS888 · Streamkalender">
<meta property="og:description" content="Streamkalender von Kreids888 — Rennen, Training und Streams.">
<meta property="og:url" content="https://kreids888.com/streamkalender.html">
<meta property="og:image" content="https://kreids888.com/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="KREIDS888 · Streamkalender">
<meta name="twitter:description" content="Streamkalender von Kreids888 — Rennen, Training und Streams.">
<meta name="twitter:image" content="https://kreids888.com/assets/og-image.jpg">

</head>
<body>
<nav id="site-nav"></nav>
<main class="page">
  <div class="container">
    <div class="lap-tag">Kalender</div>
    <h2>Streamkalender</h2>
    <div class="sk-toolbar">
      <div class="sk-weeknav">
        <button id="wkPrev" class="sk-wkbtn" onclick="weekStep(-1)">◀ Woche</button>
        <span id="wkLabel" class="sk-wklabel">…</span>
        <button id="wkNext" class="sk-wkbtn" onclick="weekStep(1)">Woche ▶</button>
      </div>
      <button class="sk-print" onclick="downloadPoster()">📥 Diese Woche als Bild (9:16)</button>
    </div>
    <div id="skList"><p class="sk-empty">Kalender wird geladen…</p></div>
    <canvas id="skPoster" width="1080" height="1920" style="display:none"></canvas>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="components.js"></script>
<script>
(function(){
  var ADMIN_API="https://kreids888-admin.kreids.workers.dev";
  var WD=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  var WD_S=["So","Mo","Di","Mi","Do","Fr","Sa"];
  var MON=["Jan","Feb","März","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");};

  var WEEKS=[];   // [{monday:Date, sunday:Date, items:[...]}]
  var IDX=0;

  function parseDT(e){
    var p=(e.date||"").split("-");
    if(p.length<3) return null;
    var t=(e.time||"00:00").split(":");
    return new Date(+p[0],+p[1]-1,+p[2],+(t[0]||0),+(t[1]||0));
  }
  function mondayOf(dt){
    var d=new Date(dt); d.setHours(0,0,0,0);
    var wd=(d.getDay()+6)%7;            // Mo=0 … So=6
    d.setDate(d.getDate()-wd);
    return d;
  }
  function fmtTime(dt){return String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0");}
  function dayLabel(dt){ return WD[dt.getDay()]+", "+dt.getDate()+". "+MON[dt.getMonth()]+" "+dt.getFullYear(); }
  function weekLabel(w){
    var a=w.monday, b=w.sunday;
    var sameMonth=a.getMonth()===b.getMonth();
    var left=a.getDate()+(sameMonth?"":". "+MON[a.getMonth()]);
    return left+". – "+b.getDate()+". "+MON[b.getMonth()]+" "+b.getFullYear();
  }

  /* Termine -> nur "ich fahre" -> in Wochen gruppieren */
  function buildWeeks(entries){
    var races=entries
      .map(function(e){ e._dt=parseDT(e); return e; })
      .filter(function(e){ return e._dt && e.racing!==false; })
      .sort(function(a,b){ return a._dt-b._dt; });

    var map={};
    races.forEach(function(e){
      var mon=mondayOf(e._dt);
      var key=mon.getTime();
      if(!map[key]){ var sun=new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
        map[key]={monday:mon,sunday:sun,items:[]}; }
      map[key].items.push(e);
    });
    var weeks=Object.keys(map).map(function(k){return map[k];})
      .sort(function(a,b){return a.monday-b.monday;});
    return weeks;
  }

  function startIndex(){
    var today=new Date(); today.setHours(0,0,0,0);
    for(var i=0;i<WEEKS.length;i++){ if(WEEKS[i].sunday>=today) return i; }
    return WEEKS.length? WEEKS.length-1 : 0;   // alles vorbei -> letzte Woche
  }

  window.weekStep=function(dir){
    IDX=Math.max(0,Math.min(WEEKS.length-1,IDX+dir));
    render();
  };

  function render(){
    var el=document.getElementById("skList");
    var lbl=document.getElementById("wkLabel");
    var prev=document.getElementById("wkPrev"), next=document.getElementById("wkNext");

    if(!WEEKS.length){
      lbl.textContent="—";
      prev.disabled=true; next.disabled=true;
      el.innerHTML='<p class="sk-empty">Aktuell keine Rennen eingetragen. Schau bald wieder vorbei!</p>';
      return;
    }
    var w=WEEKS[IDX];
    lbl.textContent=weekLabel(w);
    prev.disabled=(IDX<=0);
    next.disabled=(IDX>=WEEKS.length-1);

    var html="", curDay="";
    w.items.forEach(function(e){
      var dl=dayLabel(e._dt);
      if(dl!==curDay){ if(curDay) html+="</div>"; html+='<div class="sk-day"><div class="sk-day-h">'+dl+'</div>'; curDay=dl; }
      var time=e.time?esc(e.time):"–";
      var meta=[e.series,e.track].filter(Boolean).map(esc).join(" · ");
      var img=e.image?'<img class="sk-thumb" src="'+esc(e.image)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':'';
      html+='<div class="sk-item" data-type="'+esc(e.type||"Rennen")+'">'+
        '<div class="sk-time">'+time+'<small>UHR</small></div>'+
        '<div class="sk-main">'+img+
          '<div class="sk-txt"><div class="sk-title">'+esc(e.title)+'</div>'+
          (meta?'<div class="sk-meta">'+meta+'</div>':'')+'</div></div>'+
        '<div class="sk-right"><span class="sk-badge">'+esc(e.type||"Rennen")+'</span>'+
          '<span class="sk-race yes">🔴 Ich fahre</span></div>'+
      '</div>';
    });
    if(curDay) html+="</div>";
    el.innerHTML=html;
  }

  fetch(ADMIN_API+"/api/calendar").then(function(r){return r.json();}).then(function(d){
    var entries=Array.isArray(d.entries)?d.entries:[];
    WEEKS=buildWeeks(entries);
    IDX=startIndex();
    render();
  }).catch(function(){
    document.getElementById("skList").innerHTML='<p class="sk-empty">Kalender konnte nicht geladen werden.</p>';
    document.getElementById("wkLabel").textContent="—";
  });

  /* ================= 9:16-Poster: NUR die aktuelle Woche ================= */
  var LOGO_SRC="https://i.postimg.cc/cC8FkHnv/kreidslogo-twitch-u-yt-3.png";
  var LOGO_IMG=new Image(), LOGO_OK=false;
  LOGO_IMG.crossOrigin="anonymous";
  LOGO_IMG.onload=function(){LOGO_OK=true;};
  LOGO_IMG.onerror=function(){LOGO_OK=false;};
  LOGO_IMG.src=LOGO_SRC;

  function fitTitle(ctx,text,maxW,startSize,minSize){
    text=text.toUpperCase();
    for(var size=startSize;size>=minSize;size-=2){
      ctx.font='800 '+size+'px "Saira Condensed", sans-serif';
      if(ctx.measureText(text).width<=maxW) return {lines:[text],size:size};
    }
    var words=text.split(" ");
    for(var size2=startSize;size2>=minSize;size2-=2){
      ctx.font='800 '+size2+'px "Saira Condensed", sans-serif';
      var l1="",l2="";
      for(var i=0;i<words.length;i++){
        var w=words[i];
        if(!l2 && ctx.measureText((l1?l1+" ":"")+w).width<=maxW) l1=(l1?l1+" ":"")+w;
        else l2=(l2?l2+" ":"")+w;
      }
      if(l2 && ctx.measureText(l1).width<=maxW && ctx.measureText(l2).width<=maxW) return {lines:[l1,l2],size:size2};
      if(!l2 && ctx.measureText(l1).width<=maxW) return {lines:[l1],size:size2};
    }
    ctx.font='800 '+minSize+'px "Saira Condensed", sans-serif';
    var t=text;while(ctx.measureText(t+"…").width>maxW&&t.length>4)t=t.slice(0,-1);
    return {lines:[t+"…"],size:minSize};
  }

  function drawPoster(){
    var cv=document.getElementById("skPoster"); if(!cv) return;
    var w=WEEKS[IDX]; var items=(w?w.items:[]).slice(0,7);
    var ctx=cv.getContext("2d"); var W=1080,H=1920;
    var red="#e11324",carbon="#0a0b0e",white="#f4f5f7",steel="#8b929c",panel="#14161d",line="#242832";
    ctx.fillStyle=carbon;ctx.fillRect(0,0,W,H);
    var g=ctx.createRadialGradient(W*0.85,-100,50,W*0.85,-100,700);
    g.addColorStop(0,"rgba(225,19,36,.30)");g.addColorStop(1,"rgba(225,19,36,0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=red;ctx.fillRect(0,0,W,14);
    // Header
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
    ctx.fillStyle=red;ctx.font='700 40px "Saira Condensed", sans-serif';ctx.fillText("S T R E A M   W E E K",80,150);
    ctx.fillStyle=white;ctx.font='900 150px "Saira Condensed", Impact, sans-serif';ctx.fillText("KREIDS",78,300);
    var kw=ctx.measureText("KREIDS").width;ctx.fillStyle=red;ctx.fillText("888",82+kw+10,300);
    ctx.fillStyle=steel;ctx.font='600 40px "Saira Condensed", sans-serif';
    ctx.fillText(w?weekLabel(w).toUpperCase():"",82,364);
    ctx.strokeStyle=line;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(80,410);ctx.lineTo(W-80,410);ctx.stroke();
    // Rows
    var areaTop=470, areaBot=1520;
    if(!items.length){
      ctx.fillStyle=steel;ctx.font='700 54px "Saira Condensed", sans-serif';ctx.textAlign="center";
      ctx.fillText("DIESE WOCHE KEINE RENNEN",W/2,(areaTop+areaBot)/2);ctx.textAlign="left";
    }else{
      var rowH=(areaBot-areaTop)/items.length, ch=Math.min(rowH-16,260);
      items.forEach(function(s,i){
        var dt=s._dt; var y=areaTop+i*rowH;
        ctx.fillStyle=panel;ctx.fillRect(80,y,W-160,ch);
        ctx.fillStyle=red;ctx.fillRect(80,y,10,ch);
        ctx.textAlign="center";
        ctx.fillStyle=red;ctx.font='900 74px "Saira Condensed", Impact, sans-serif';
        ctx.fillText(WD_S[dt.getDay()].toUpperCase(),195,y+ch*0.44);
        ctx.fillStyle=steel;ctx.font='600 36px "Saira Condensed", sans-serif';
        ctx.fillText(dt.getDate()+". "+MON[dt.getMonth()],195,y+ch*0.70);
        ctx.strokeStyle=line;ctx.beginPath();ctx.moveTo(310,y+26);ctx.lineTo(310,y+ch-26);ctx.stroke();
        var tx=345, maxW=(W-90)-tx;
        var fit=fitTitle(ctx,s.title||"Rennen",maxW,52,30);
        var lh=fit.size*1.02;
        var blockH=fit.lines.length*lh + 44;
        var ty=y+(ch-blockH)/2+fit.size;
        ctx.textAlign="left";ctx.fillStyle=white;ctx.font='800 '+fit.size+'px "Saira Condensed", sans-serif';
        fit.lines.forEach(function(l){ctx.fillText(l,tx,ty);ty+=lh;});
        ctx.fillStyle=steel;ctx.font='600 38px "Saira Condensed", sans-serif';
        ctx.fillText(fmtTime(dt)+" Uhr",tx,ty+10);
      });
    }
    // Footer: Logo (füllt das untere Band)
    ctx.fillStyle=red;ctx.fillRect(0,H-300,W,4);
    var bandMid=H-150; // Mitte des unteren Bandes (1620..1920)
    if(LOGO_OK && LOGO_IMG.width){
      var maxW2=920,maxH=230;
      var r=Math.min(maxW2/LOGO_IMG.width,maxH/LOGO_IMG.height);
      var lw=LOGO_IMG.width*r,lh2=LOGO_IMG.height*r;
      ctx.drawImage(LOGO_IMG,(W-lw)/2,bandMid-lh2/2,lw,lh2);
    }else{
      ctx.textAlign="center";ctx.fillStyle=white;ctx.font='900 100px "Saira Condensed", Impact, sans-serif';
      ctx.fillText("KREIDS888",W/2,bandMid-6);
      ctx.fillStyle=steel;ctx.font='600 42px "Saira Condensed", sans-serif';
      ctx.fillText("TWITCH + YOUTUBE",W/2,bandMid+54);ctx.textAlign="left";
    }
    ctx.textBaseline="alphabetic";
  }

  window.downloadPoster=function(){
    if(!WEEKS.length || !WEEKS[IDX] || !WEEKS[IDX].items.length){ alert("Diese Woche gibt es keine Rennen zum Speichern."); return; }
    var ready = document.fonts ? document.fonts.ready : Promise.resolve();
    ready.then(function(){
      drawPoster();
      var cv=document.getElementById("skPoster");
      try{
        var url=cv.toDataURL("image/png");
        var a=document.createElement("a");a.href=url;
        a.download="kreids888-streamweek-"+WEEKS[IDX].monday.toISOString().slice(0,10)+".png";a.click();
      }catch(e){
        alert("Der externe Logo-Link sperrt den Bild-Download (CORS). Lösung: Logo als kreidslogo.png ins Repo legen und im Skript LOGO_SRC darauf zeigen — dann klappt der Download sicher.");
      }
    });
  };
})();
</script>
</body></html>
