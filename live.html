<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KREIDS888 · Livetracking</title>
<link rel="stylesheet" href="style.css">
<meta name="description" content="Livetracking von Kreids888 — iRacing-Rennen in Echtzeit: Positionen, Rundenzeiten, Strafen.">
<link rel="canonical" href="https://kreids888.com/live.html">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KREIDS888">
<meta property="og:locale" content="de_DE">
<meta property="og:title" content="KREIDS888 · Livetracking">
<meta property="og:description" content="Livetracking von Kreids888 — iRacing-Rennen in Echtzeit.">
<meta property="og:url" content="https://kreids888.com/live.html">
<meta property="og:image" content="https://kreids888.com/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="KREIDS888 · Livetracking">
<meta name="twitter:description" content="Livetracking von Kreids888 — iRacing-Rennen in Echtzeit.">
<meta name="twitter:image" content="https://kreids888.com/assets/og-image.jpg">
<meta name="theme-color" content="#0a0a0a">
</head>
<body>
<nav id="site-nav"></nav>
<main class="page">
  <div class="container">
    <div class="lap-tag">Live Timing</div>
    <div class="lt-head">
      <span class="lt-live" id="ltLive"><span class="d"></span><span id="ltLiveTxt">Verbinde…</span></span>
      <span class="lt-ch">📺 KREIDS888</span>
    </div>

    <!-- LIVE -->
    <div id="ltApp" class="hidden">
      <div class="lt-session">
        <div class="lt-scell"><div class="k">Strecke</div><div class="v" id="sTrack">–</div></div>
        <div class="lt-scell"><div class="k">Session</div><div class="v" id="sType">–</div></div>
        <div class="lt-scell"><div class="k">Führende Runde</div><div class="v" id="sLap">–</div></div>
        <div class="lt-scell"><div class="k">Restzeit</div><div class="v" id="sRemain">–</div></div>
      </div>

      <div class="lt-flagbar" id="ltFlag"><span id="ltFlagIco">🚩</span><span id="ltFlagTxt"></span></div>

      <div class="lt-panel">
        <div class="lt-panel-h">Fahrergrid <span class="cnt" id="gridCnt"></span></div>
        <table class="lt-table">
          <thead><tr><th>Pos</th><th>Nr</th><th>Fahrer</th><th>Team</th><th>Rd</th><th>Letzte</th><th>Beste</th></tr></thead>
          <tbody id="ltGrid"></tbody>
        </table>
      </div>

      <div class="lt-panel">
        <div class="lt-panel-h">Strafen <span class="cnt" id="penCnt"></span></div>
        <table class="lt-table">
          <thead><tr><th>Nr</th><th>Fahrer</th><th>Art</th><th>Runde</th><th>Status</th></tr></thead>
          <tbody id="ltPens"></tbody>
        </table>
      </div>

      <div class="lt-panel">
        <div class="lt-panel-h">Ereignisse</div>
        <div id="ltEvents"></div>
      </div>
    </div>

    <!-- OFFLINE -->
    <div id="ltOffline" class="lt-offline">
      <h3>Gerade offline</h3>
      <p id="ltOfflineMsg">Wenn ich ein Rennen fahre, siehst du hier Positionen, Rundenzeiten, Strafen und Ereignisse in Echtzeit.</p>
    </div>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="components.js"></script>
<script>
/* Live-Timing: Daten kommen NUR vom eigenen Tool "Kreids Racecontrol"
   ueber den Worker kreids888-racecontrol (nur lesen). */
(function(){
  var SOURCE = "wss://kreids888-racecontrol.kreids.workers.dev/public";
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
  var ws = null, retry = 2000;

  function fmtLap(sec){ sec=Number(sec)||0; if(sec<=0) return "–"; var m=Math.floor(sec/60), s=sec-m*60; return m+":"+(s<10?"0":"")+s.toFixed(3); }
  function fmtRemain(sec){ if(sec==null) return "–"; sec=Math.max(0,Math.floor(Number(sec))); var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60,p=function(n){return(n<10?"0":"")+n;}; return (h?h+":"+p(m):m)+":"+p(s); }

  function setLive(on){
    $("ltLive").className = "lt-live" + (on?" on":"");
    $("ltLiveTxt").textContent = on ? "LIVE" : "Offline";
    $("ltApp").classList.toggle("hidden", !on);
    $("ltOffline").classList.toggle("hidden", !!on);
  }

  function flagClassFor(text){
    var t=(text||"").toLowerCase();
    if(t.indexOf("rote")>=0) return ["red","🔴"];
    if(t.indexOf("full course yellow")>=0||t.indexOf("gelbe")>=0) return ["yellow","🟡"];
    if(t.indexOf("zielflagge")>=0) return ["chq","🏁"];
    if(t.indexOf("weisse")>=0||t.indexOf("weiße")>=0) return ["chq","⚪"];
    if(t.indexOf("green")>=0||t.indexOf("grün")>=0||t.indexOf("runde bis")>=0) return ["green","🟢"];
    return ["yellow","🚩"];
  }
  function renderFlag(flag){
    var bar=$("ltFlag");
    if(!flag){ bar.style.display="none"; return; }
    var fc=flagClassFor(flag); bar.className="lt-flagbar "+fc[0]; bar.style.display="flex";
    $("ltFlagIco").textContent=fc[1]; $("ltFlagTxt").textContent=String(flag).toUpperCase();
  }
  function panel(id, show){
    var el=$(id); if(!el) return;
    var p=el.closest(".lt-panel"); if(p) p.style.display = show ? "" : "none";
  }

  function render(state){
    var live = state && state.live;
    setLive(!!live);
    if(!live){
      $("ltOfflineMsg").textContent = (state && state.reason==="disabled")
        ? "Die Live-Ansicht ist gerade deaktiviert. Schau später wieder vorbei!"
        : "Wenn ich ein Rennen fahre, siehst du hier Positionen, Rundenzeiten, Strafen und Ereignisse in Echtzeit.";
      return;
    }
    var s = state.session || {};
    $("sTrack").textContent = s.track || "–";
    $("sType").textContent = s.session_type || "–";
    $("sLap").textContent = (s.leader_lap!=null ? s.leader_lap + (s.laps_total ? " / "+s.laps_total : "") : "–");
    $("sRemain").textContent = fmtRemain(s.time_remain);
    renderFlag(s.flag);

    // Grid
    panel("ltGrid", Array.isArray(state.drivers));
    if(Array.isArray(state.drivers)){
      var ds = state.drivers.slice().sort(function(a,b){return (a.position||999)-(b.position||999);});
      var n = ds.filter(function(d){return !d.left;}).length;
      $("gridCnt").textContent = n + " Fahrzeuge";
      $("ltGrid").innerHTML = ds.map(function(d){
        return "<tr"+(d.left?' style="opacity:.45"':"")+">"+
          '<td class="pos">'+(d.position||"–")+"</td>"+
          '<td class="num">#'+esc(d.number)+"</td>"+
          '<td>'+esc(d.name)+(d.on_pit?'<span class="pit-badge">PIT</span>':"")+(d.left?'<span class="pit-badge">OUT</span>':"")+"</td>"+
          '<td class="muted">'+esc(d.team||"")+"</td>"+
          '<td class="num">'+(d.lap!=null?d.lap:"–")+"</td>"+
          '<td class="num">'+fmtLap(d.last_lap)+"</td>"+
          '<td class="num">'+fmtLap(d.best_lap)+"</td>"+
        "</tr>";
      }).join("") || '<tr><td colspan="7" class="lt-empty">Noch keine Fahrzeuge auf der Strecke.</td></tr>';
    }

    // Strafen
    panel("ltPens", Array.isArray(state.penalties));
    if(Array.isArray(state.penalties)){
      $("penCnt").textContent = state.penalties.length ? state.penalties.length+"" : "";
      $("ltPens").innerHTML = state.penalties.slice().reverse().map(function(p){
        var cls = p.status==="offen" ? "pen-offen" : "pen-erledigt";
        return "<tr>"+
          '<td class="num">#'+esc(p.car)+"</td>"+
          '<td>'+esc(p.name||"")+"</td>"+
          "<td>"+esc(p.kind)+"</td>"+
          '<td class="num">'+(p.given_lap!=null?p.given_lap:"–")+"</td>"+
          '<td class="'+cls+'">'+esc(p.status)+"</td>"+
        "</tr>";
      }).join("") || '<tr><td colspan="5" class="lt-empty">Bisher keine Strafen — sauberes Rennen!</td></tr>';
    }

    // Ereignisse
    panel("ltEvents", Array.isArray(state.events));
    if(Array.isArray(state.events)){
      $("ltEvents").innerHTML = state.events.slice().reverse().map(function(e){
        return '<div class="lt-ev"><span class="t">'+esc(e.wall_clock||"")+'</span><span>'+esc(e.text||"")+"</span></div>";
      }).join("") || '<div class="lt-empty">Noch keine Ereignisse.</div>';
    }
  }

  function connect(){
    try { ws = new WebSocket(SOURCE); } catch(e){ setTimeout(connect, retry); return; }
    ws.onopen = function(){ retry = 2000; };
    ws.onmessage = function(ev){
      var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
      if(m.type==="state") render(m);
    };
    ws.onclose = function(){ setTimeout(connect, retry); retry = Math.min(retry*2, 30000); };
    ws.onerror = function(){ try{ws.close();}catch(e){} };
  }

  setLive(false);
  connect();
})();
</script>
</body>
</html>
